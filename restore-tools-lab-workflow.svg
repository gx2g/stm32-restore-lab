<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="hwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="16" fill="url(#bgGrad)"/>
  
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="540"/>
    <line x1="360" y1="0" x2="360" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="600" y1="0" x2="600" y2="540"/>
    <line x1="720" y1="0" x2="720" y2="540"/>
    <line x1="840" y1="0" x2="840" y2="540"/>
    <line x1="0" y1="135" x2="960" y2="135"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="405" x2="960" y2="405"/>
  </g>

  <g transform="translate(40, 50)">
    <rect width="180" height="28" rx="6" fill="url(#accentGrad)" opacity="0.15"/>
    <text x="10" y="19" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#38bdf8" letter-spacing="1">EMBEDDED TOOLS LAB</text>
    <text x="0" y="60" font-family="Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">restore-tools-lab Workflow</text>
    <text x="0" y="82" font-family="Segoe UI, sans-serif" font-size="14" fill="#94a3b8">Automated flashing, verification, and failure triage pipeline</text>
  </g>

  <g transform="translate(40, 160)" filter="url(#dropShadow)">
    <rect width="260" height="320" rx="12" fill="url(#pythonGrad)" stroke="#4338ca" stroke-width="2"/>
    <rect width="260" height="45" rx="12" fill="#1e1b4b"/>
    <circle cx="20" cy="22" r="5" fill="#ef4444"/>
    <circle cx="36" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="22" r="5" fill="#10b981"/>
    <text x="245" y="27" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#6366f1" text-anchor="end">HOST PC</text>
    
    <text x="20" y="80" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">restore-tools-lab CLI</text>
    
    <rect x="15" y="100" width="230" height="190" rx="6" fill="#0f172a" stroke="#312e81"/>
    <text x="25" y="125" font-family="Courier New, monospace" font-size="12" fill="#a7f3d0">$ restore-tools-lab cycle</text>
    <text x="35" y="145" font-family="Courier New, monospace" font-size="11" fill="#64748b">--config configs/nucleo.yaml</text>
    <text x="35" y="160" font-family="Courier New, monospace" font-size="11" fill="#64748b">--image blink.bin</text>
    
    <text x="25" y="195" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#818cf8">Orchestrated Tasks:</text>
    <text x="25" y="220" font-family="Segoe UI, sans-serif" font-size="12" fill="#e2e8f0">⚙️ 1. Parse YAML Config</text>
    <text x="25" y="245" font-family="Segoe UI, sans-serif" font-size="12" fill="#e2e8f0">⚙️ 2. Invoke STM32_Programmer</text>
    <text x="25" y="270" font-family="Segoe UI, sans-serif" font-size="12" fill="#e2e8f0">⚙️ 3. Listen to PySerial Port</text>
  </g>

  <g transform="translate(315, 220)">
    <path d="M 0 10 L 100 10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="100,10 92,5 92,15" fill="#38bdf8"/>
    <text x="50" y="-5" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">1. SWD FLASH</text>
    <text x="50" y="30" font-family="Courier New, monospace" font-size="10" fill="#64748b" text-anchor="middle">STM32_Programmer_CLI</text>
  </g>

  <g transform="translate(315, 380)">
    <path d="M 100 10 L 0 10" fill="none" stroke="#a7f3d0" stroke-width="3"/>
    <polygon points="0,10 8,5 8,15" fill="#a7f3d0"/>
    <text x="50" y="-5" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0" text-anchor="middle">2. UART LOGS</text>
    <text x="50" y="30" font-family="Courier New, monospace" font-size="10" fill="#64748b" text-anchor="middle">pyserial (115200 baud)</text>
  </g>

  <g transform="translate(430, 160)" filter="url(#dropShadow)">
    <rect width="240" height="320" rx="12" fill="url(#hwGrad)" stroke="#047857" stroke-width="2"/>
    <rect width="240" height="45" rx="12" fill="#064e3b"/>
    <text x="20" y="28" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#34d399">TARGET BOARD</text>
    <text x="220" y="27" font-family="Courier New, monospace" font-size="12" fill="#a7f3d0" text-anchor="end">MCU</text>

    <rect x="70" y="75" width="100" height="100" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="120" y="125" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">STM32</text>
    <text x="120" y="145" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">F411RE / L475E</text>
    <g fill="#94a3b8">
      <rect x="60" y="90" width="10" height="6"/> <rect x="60" y="110" width="10" height="6"/> <rect x="60" y="130" width="10" height="6"/>
      <rect x="170" y="90" width="10" height="6"/> <rect x="170" y="110" width="10" height="6"/> <rect x="170" y="130" width="10" height="6"/>
      <rect x="90" y="65" width="6" height="10"/> <rect x="110" y="65" width="6" height="10"/> <rect x="130" y="65" width="6" height="10"/>
      <rect x="90" y="175" width="6" height="10"/> <rect x="110" y="175" width="6" height="10"/> <rect x="130" y="175" width="6" height="10"/>
    </g>

    <rect x="20" y="200" width="200" height="95" rx="6" fill="#022c22" stroke="#059669"/>
    <text x="32" y="225" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Verification Checkpoint:</text>
    <text x="32" y="250" font-family="Courier New, monospace" font-size="12" fill="#f8fafc">✔ Flash @ 0x08000000</text>
    <text x="32" y="272" font-family="Courier New, monospace" font-size="12" fill="#fb7185">⚠ Boot Marker: "BOOT_OK"</text>
  </g>

  <g transform="translate(680, 310)">
    <path d="M 0 10 L 40 10" fill="none" stroke="#f43f5e" stroke-width="3"/>
    <polygon points="40,10 32,5 32,15" fill="#f43f5e"/>
    <text x="20" y="-5" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#f43f5e" text-anchor="middle">IF FAIL</text>
  </g>

  <g transform="translate(730, 160)" filter="url(#dropShadow)">
    <rect width="190" height="320" rx="12" fill="url(#docGrad)" stroke="#b91c1c" stroke-width="2"/>
    <rect width="190" height="45" rx="12" fill="#7c2d12"/>
    <text x="15" y="28" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#fdba74">LAB ARTIFACTS</text>

    <rect x="15" y="65" width="160" height="65" rx="6" fill="#1e293b" stroke="#fdba74" stroke-width="1"/>
    <text x="25" y="85" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#fdba74">📊 Execution Logs</text>
    <text x="25" y="105" font-family="Courier New, monospace" font-size="10" fill="#94a3b8">output/csv/trends.csv</text>
    <text x="25" y="118" font-family="Courier New, monospace" font-size="10" fill="#94a3b8">logs/raw/nucleo.log</text>

    <rect x="15" y="145" width="160" height="150" rx="6" fill="#fff" stroke="#b91c1c" stroke-width="1"/>
    <rect width="160" height="25" rx="1" fill="#fee2e2" x="15" y="145"/>
    <text x="25" y="162" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">📖 triage_playbook.md</text>
    
    <text x="25" y="190" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Failure Mode Drills:</text>
    <text x="25" y="210" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">❌ Wrong Serial Port/Baud</text>
    <text x="25" y="230" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">❌ Bad Image Injection</text>
    <text x="25" y="250" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">❌ Mid-flash Disconnect</text>
    <text x="25" y="270" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">❌ Reset Timing Race</text>
  </g>

  <path d="M 825 490 L 825 510 L 170 510 L 170 490" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="497" y="525" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Continuous Improvement: Triage notes update automation edge-cases</text>
</svg>
